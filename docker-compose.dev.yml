name: ai-agents-platform-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_agents
      POSTGRES_PASSWORD: ai_agents
      POSTGRES_DB: ai_agents_platform
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agents -d ai_agents_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
